<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>Pomodoro</title>
        <meta name="description" content="Simple pomodoro timer.">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="css/styles.css">
        
        <!-- Font "Space Grotesk" from Google Fonts -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
    </head>
    <body>
        <header class="container centered">
            <h1>Pomodoro Timer</h1>
        </header>

        <div id="timer-container" class="container vertical-centered">
            <!-- To be filled in by JS -->
        </div>

        <div id="button-container" class="container centered">
            <!-- To be filled in by JS -->
        </div>

        <!-- Use defer to avoid having to add an event listener for DOMContentLoaded -->
        <script type="module" src="js/main.js" defer></script>
    </body>
</html>
